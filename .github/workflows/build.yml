name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required for gh release create

    steps:
      # GoidaDI and GoidaAuth are checked out as siblings under the runner workspace, mirroring local
      # development. GoidaAuth is a compileOnly dependency resolved through a Gradle composite build
      # (see settings.gradle); actions/checkout cannot place a repo outside the workspace root, so both
      # land inside it instead of using a literal "../GoidaAuth" path.
      - name: Checkout GoidaDI
        uses: actions/checkout@v4
        with:
          path: GoidaDI

      - name: Checkout GoidaAuth (composite build, compileOnly)
        uses: actions/checkout@v4
        with:
          repository: Yukovsky/GoidaAuth
          path: GoidaAuth

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: GoidaDI
        run: chmod +x gradlew

      # Discord Integration is a compileOnly dependency shipped as a loose jar (not on Maven Central).
      # Pulled straight from its own Modrinth release so the build works without committing a third-party binary.
      - name: Fetch Discord Integration (compileOnly)
        working-directory: GoidaDI
        run: |
          curl -sSL -o dcintegration-neoforge-3.0.7-1.21.jar \
            https://cdn.modrinth.com/data/rbJ7eS5V/versions/Tvnxofx4/dcintegration-neoforge-3.0.7-1.21.jar

      - name: Build
        working-directory: GoidaDI
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoidaDI-${{ github.sha }}
          path: GoidaDI/build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: GoidaDI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/libs/*.jar \
            --title "GoidaDI ${{ github.ref_name }}" \
            --generate-notes

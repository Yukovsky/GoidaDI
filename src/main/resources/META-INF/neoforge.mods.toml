modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Yukovsky/GoidaDI/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

# Discord Integration — optional. We reuse its live JDA bot and event API when present.
# ordering=AFTER guarantees we load (and can register our DiscordEventHandler) after DI started.
[[dependencies.${mod_id}]]
modId="dcintegration"
type="optional"
versionRange="[3.0,)"
ordering="AFTER"
side="SERVER"

# GoidaAuth — optional. Provides the "player authorized" and "account transferred" hooks plus
# UUID-by-name resolution. Everything still works (with a polling fallback) when absent.
[[dependencies.${mod_id}]]
modId="goidaauth"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="SERVER"

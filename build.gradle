plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = '2024.07.28'
        minecraftVersion = '1.21'
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.lucko.me/' }
}

dependencies {
    // H2 is bundled (jarJar) exactly like GoidaAuth — GoidaDI keeps its own database.
    jarJar(implementation('com.h2database:h2:2.2.224'))

    // Discord Integration — compile only. We extend its DiscordEventHandler and touch JDA types
    // (JDA is NOT relocated inside the jar), so the classes must be on the compile classpath. At
    // runtime DI is a soft dependency: every access is guarded (see DcIntegrationCompat).
    compileOnly files('dcintegration-neoforge-3.0.7-1.21.jar')

    // GoidaAuth — compile only, resolved from the composite build above. Soft dependency at runtime
    // (all references isolated in the compat package and guarded by ModList.isLoaded("goidaauth")).
    if (file('../GoidaAuth/settings.gradle').exists()) {
        compileOnly('ru.goidacraft.goidaauth:goidaauth:1.1.0') { transitive = false }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
